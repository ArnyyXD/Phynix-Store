<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_val" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1923"/>
      <stop offset="50%" stop-color="#1B2733"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="red_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4655" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BD1E2C" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="spot_val" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF4655" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F1923" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow_val" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg_val)"/>
  <circle cx="600" cy="300" r="450" fill="url(#spot_val)"/>

  <!-- Geometric Grid & Valorant Shapes -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Angular Tactical Slashes -->
  <path d="M-50 675 L350 0 L450 0 L50 675 Z" fill="url(#red_glow)" opacity="0.25"/>
  <path d="M1250 0 L850 675 L750 675 L1150 0 Z" fill="#FF4655" opacity="0.12"/>

  <!-- Giant Valorant 'V' Mark in Center -->
  <g transform="translate(600, 290)" filter="url(#glow_val)">
    <!-- Glow Layer -->
    <path d="M-130 -140 L-10 130 L110 -140 H190 L-10 210 L-210 -140 Z" fill="#FF4655" opacity="0.4"/>
    <!-- Crisp Central V -->
    <path d="M-110 -120 L0 110 L110 -120 H170 L0 180 L-170 -120 Z" fill="#FF4655"/>
    <path d="M-30 -120 L0 -60 L30 -120 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Tech Typography & Watermark Accents -->
  <text x="600" y="540" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="18" text-anchor="middle" opacity="0.95">VALORANT</text>
  <text x="600" y="585" font-family="monospace" font-size="16" fill="#FF4655" letter-spacing="8" text-anchor="middle" font-weight="700">DEFY THE LIMITS // 5v5 TACTICAL SHOOTER</text>

  <!-- HUD Accents -->
  <rect x="50" y="50" width="16" height="16" fill="#FF4655"/>
  <rect x="74" y="50" width="6" height="6" fill="#FFFFFF" opacity="0.6"/>
  <rect x="1134" y="50" width="16" height="16" fill="#FF4655"/>
  <rect x="50" y="609" width="40" height="2" fill="#FF4655"/>
  <rect x="1110" y="609" width="40" height="2" fill="#FF4655"/>
</svg>
